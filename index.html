<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Cidadela</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .metade {
            position: fixed;
            left: 0;
            width: 100%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1s ease-in;
        }

        .cima {
    top: 0;
    height: calc(50% + 1px);
    align-items: flex-end;
    padding-bottom: 20px;
    background: url("img/1x/fundo-capa.jpg") center top / 100% 200% no-repeat;
        }

        .baixo {
            bottom: 0;
            align-items: flex-start;
            padding-top: 150px;
            background: url("img/1x/fundo-capa.jpg") center bottom / 100% 200% no-repeat;
        }

        .titulo {
            color: #fff;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
        }

        #garimpar {
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  transition: transform 0.18s steps(4);
}

#garimpar img {
  display: block;
  width: 160px;
  image-rendering: pixelated;
  transition: filter 0.18s steps(4);
}

/* mouse em cima (ou foco do teclado): sobe, cresce e ganha sombra dura */
#garimpar:hover,
#garimpar:focus-visible {
  transform: translateY(-6px) scale(1.06);
}

#garimpar:hover img,
#garimpar:focus-visible img {
  filter: drop-shadow(5px 5px 0 #1557ff);
}

/* clique: afunda, como um botão apertando */
#garimpar:active {
  transform: translateY(2px) scale(0.97);
}

#garimpar:active img {
  filter: drop-shadow(0 0 0 #1557ff);
}

@media (prefers-reduced-motion: reduce) {
  #garimpar, #garimpar img { transition: none; }
}

        .linha {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0;
            border-top: 3px dashed #fff;
            z-index: 5;
        }

        .tesoura {
            position: fixed;
            top: 50.6%;
            left: 35px;
            transform: translate(-50%, -50%);
            font-size: 36px;
            z-index: 6;
            transition: left 1.1s linear;
        }

        .aberto .cima {
            transform: translateY(-100%);
        }

        .aberto .baixo {
            transform: translateY(100%);
        }

        .aberto .tesoura {
            left: 100%;
        }
        .logo {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 7;
    transition: opacity 0.4s;
    animation: sobe 0.9s ease-in-out 2.2s forwards;
}

.logo img {
    display: block;
    width: 30vw;
    animation: zoom 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}

.linha,
.tesoura,
#garimpar {
    opacity: 0;
    animation: aparece 0.6s ease 3s forwards;
}

.aberto .logo {
    opacity: 0;
}

@keyframes zoom {
    from { transform: scale(0.15); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes sobe {
    to { top: 24%; }
}

@keyframes aparece {
    to { opacity: 1; }
}
.tesoura img {
    display: block;
    width: 120px;
}
.destino {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 0;
}

.metade,
.tesoura {
    transition: none;
}

.aberto .cima,
.aberto .baixo {
    transform: none;
}
    </style>
</head>
<body>
    <iframe class="destino" src="garimpar.html"></iframe>

    <div class="logo"><img src="img/1x/logocapa.png" alt="Recorte"></div>

    <div class="metade cima"></div>

    <div class="linha"></div>
    <div class="tesoura" id="tesoura"><img src="img/1x/tesoura-capa.gif" alt="Tesoura"></div>

    <div class="metade baixo">
        <button id="garimpar"><img src="img\1x\botao-garimpar.png" alt="Garimpar"></button>
    </div>

    <script>
        const DURACAO = 2200;
        const ABERTURA = 0.5;

        const botao = document.getElementById("garimpar");
        const tesoura = document.getElementById("tesoura");
        const linha = document.querySelector(".linha");
        const cima = document.querySelector(".cima");
        const baixo = document.querySelector(".baixo");
        let cortando = false;

        botao.addEventListener("click", function () {
            if (cortando) return;
            cortando = true;

            const inicio = parseFloat(getComputedStyle(tesoura).left);
            tesoura.style.left = inicio + "px";
            document.body.classList.add("aberto");

            const largura = window.innerWidth;
            const k = largura * ABERTURA;
            const total = largura + k;
            const t0 = performance.now();

            function passo(agora) {
                const p = Math.min((agora - t0) / DURACAO, 1);
                const x = p * total;

                tesoura.style.left = (inicio + x) + "px";
                linha.style.clipPath = "inset(0 0 0 " + x + "px)";
                cima.style.clipPath = "polygon(" + (x - k) + "px 0, 100% 0, 100% 100%, " + x + "px 100%)";
                baixo.style.clipPath = "polygon(" + x + "px 0, 100% 0, 100% 100%, " + (x - k) + "px 100%)";

                if (p < 1) {
                    requestAnimationFrame(passo);
                } else {
                    setTimeout(function () {
                        // Em vez de trocar de página, esconde a capa e libera a página de trás
document.querySelectorAll("body > *:not(.destino):not(script):not(style)").forEach(function (el) {
  el.style.display = "none";
});
const destino = document.querySelector(".destino");
destino.style.pointerEvents = "auto";
destino.style.zIndex = "9999";
                    }, 150);
                }
            }

            requestAnimationFrame(passo);
        });
    </script>
</body>
</html>
